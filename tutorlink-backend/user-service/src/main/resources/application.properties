spring.application.name=user-service
server.port=8082

# Connexion à ta base de données phpMyAdmin (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/tutorlink_users?useSSL=false&serverTimezone=Africa/Douala
spring.datasource.username=root
spring.datasource.password=ab1234

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enregistrement dans Eureka
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
app.upload.dir=uploads/avatars
app.upload.public-base-url=http://localhost:8083/files/avatars
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=45000
