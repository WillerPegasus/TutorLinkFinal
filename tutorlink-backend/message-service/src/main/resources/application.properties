spring.application.name=message-service
server.port=8086

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tutorlink_messages?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Douala
spring.datasource.username=root
spring.datasource.password=ab1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8080/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=45000

