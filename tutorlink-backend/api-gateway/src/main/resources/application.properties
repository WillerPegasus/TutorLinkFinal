spring.application.name=api-gateway
server.port=8080

# Eureka Server
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true

# Routes
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=tutor-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://tutor-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/tutors/**

spring.cloud.gateway.server.webmvc.routes[3].id=booking-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.server.webmvc.routes[5].id=message-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://message-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/messages/**

# NOUVEAU V3 - Route groupes (gérés dans tutor-service)
spring.cloud.gateway.server.webmvc.routes[6].id=tutor-service-groups
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://tutor-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/groups/**

# JWT Secret
app.jwt.secret=tutorlink_secret_key_2026_very_long_secure

# URLs directes des microservices (pour AdminStatsController)
services.auth-service.url=http://localhost:8081
services.user-service.url=http://localhost:8082
services.tutor-service.url=http://localhost:8083
services.booking-service.url=http://localhost:8084
services.notification-service.url=http://localhost:8085
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=45000
