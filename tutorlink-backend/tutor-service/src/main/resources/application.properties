# Server
server.port=8083
spring.application.name=tutor-service

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tutorlink_tutors?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ab1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
eureka.instance.prefer-ip-address=true

# Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
