spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
feign.circuitbreaker.enabled=false
# AJOUT — valeurs factices pour permettre au contexte de test de démarrer
mtn.momo.subscription-key=test-subscription-key
mtn.momo.api-user=test-api-user
mtn.momo.api-key=test-api-key
mtn.momo.base-url=https://sandbox.momodeveloper.mtn.com
mtn.momo.target-environment=sandbox

# AJOUT — valeurs factices Orange Money pour le contexte de test
orange.momo.client-id=test-client-id
orange.momo.client-secret=test-client-secret
orange.momo.merchant-key=test-merchant-key
orange.momo.auth-url=https://api.orange.com/oauth/v3/token
orange.momo.base-url=https://api.orange.com/orange-money-webpay/dev/v1/webpayment
orange.momo.return-url=https://tonsite.com/payment/success
orange.momo.cancel-url=https://tonsite.com/payment/cancel
